
services:
  - type: web
    name: blog-app-snowy-morning
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bin/rails server -p $PORT -e production"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blog-app-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: blog-app-db
    plan: free
    databaseName: blog_app
    user: blog_app
